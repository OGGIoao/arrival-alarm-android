name: Android checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6

      - name: Install Android SDK components
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" "platforms;android-36" "build-tools;36.0.0"

      - name: Test, lint, and validate release bundle
        shell: pwsh
        working-directory: android-app
        run: .\gradlew.bat clean testDebugUnitTest lintRelease bundleRelease validateReleaseBundle --no-daemon

      - name: Upload unsigned verification bundle and reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: android-release-verification-unsigned
          if-no-files-found: warn
          path: |
            android-app/build/outputs/bundle/release/*.aab
            android-app/build/reports/tests/
            android-app/build/reports/lint-results-release.*
